name: Publish signed generic Family Portal v1.0.0

# Maintainer-only operation in the PUBLIC distribution repository.
# Never clones family databases, writes Cloudflare, or deploys Nerén production.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Jag godkänner att signera och publicera Familjeportal v1.0.0"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: first-signed-family-portal-v1
  cancel-in-progress: false

jobs:
  publish:
    if: ${{ github.repository == 'valfrid/nerenportal-releases' && github.ref == 'refs/heads/main' && github.actor == 'valfrid' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    environment: family-portal-release-publisher
    env:
      RELEASE_TAG: v1.0.0
      FROZEN_SOURCE_SHA: 11df28d7906c5c4619076334a9e7e1789cf900e6
      GH_REPO: valfrid/nerenportal-releases
    steps:
      - name: Verify publication prerequisites and prevent overwriting a release
        env:
          PUBLICATION_CONFIRMATION: ${{ inputs.confirmation }}
          GH_TOKEN: ${{ github.token }}
          SOURCE_READ_TOKEN_EXISTS: ${{ secrets.PORTAL_SOURCE_READ_TOKEN != '' }}
          SIGNER_EXISTS: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY_PEM != '' }}
          PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          test "$PUBLICATION_CONFIRMATION" = "true" || { echo "::error::Markera bekräftelserutan när du startar publiceringen"; exit 1; }
          test "$SOURCE_READ_TOKEN_EXISTS" = true || { echo "::error::Private source read token not configured"; exit 1; }
          test "$SIGNER_EXISTS" = true || { echo "::error::Offline publisher signing key not configured"; exit 1; }
          [[ "$PUBLIC_KEY" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Pinned public signing key not configured"; exit 1; }
          if gh release view "$RELEASE_TAG" -R "$GH_REPO" >/dev/null 2>&1; then
            echo "::error::Release $RELEASE_TAG already exists; it must not be overwritten"
            exit 1
          fi
          if gh api "repos/$GH_REPO/git/ref/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::error::Tag $RELEASE_TAG already exists; it must not be reused"
            exit 1
          fi

      - name: Checkout exactly the reviewed PRIVATE source commit
        uses: actions/checkout@v4
        with:
          repository: valfrid/nerenportal
          ref: 11df28d7906c5c4619076334a9e7e1789cf900e6
          token: ${{ secrets.PORTAL_SOURCE_READ_TOKEN }}
          path: frozen-source
          persist-credentials: false

      - name: Verify source identity
        working-directory: frozen-source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FROZEN_SOURCE_SHA"
          test "$(git status --porcelain)" = ""
          test ! -e package-lock.json || echo "Source package-lock available"
          test -f scripts/releases/build-release.mjs
          test -f src/installer-release.js
          test -f docs/v1-fictional-family-wizard-acceptance.md
          echo "Reviewed source commit confirmed; no Cloudflare deployment will be run."

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build and test the generic release OFFLINE from Cloudflare
        working-directory: frozen-source
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          npm install --ignore-scripts --no-audit --no-fund
          node scripts/copy-webauthn-browser.mjs
          node --test tests/*.test.js
          node scripts/staging/provision.mjs --check
          node scripts/releases/build-release.mjs --build "$RELEASE_TAG" "$FROZEN_SOURCE_SHA"
          test -s package-lock.json # Preserve the exact dependency resolution that built these binaries.

      - name: Inspect release package for private material and pilot seed data
        working-directory: frozen-source
        run: |
          set -euo pipefail
          folder=".release-work/$RELEASE_TAG"
          test -s "$folder/portal-worker-package.tar.gz"
          test -s "$folder/schema-migrations.tar.gz"
          tar -tzf "$folder/portal-worker-package.tar.gz" > /tmp/portal-v1-files.txt
          tar -tzf "$folder/schema-migrations.tar.gz" > /tmp/portal-v1-migrations.txt
          if grep -E '(^|/)(\.env|\.git|\.npmrc|node_modules|wrangler\.jsonc|.*\.pem|.*\.key)(/|$)' /tmp/portal-v1-files.txt; then
            echo "::error::Disallowed source or private file in release package"; exit 1
          fi
          for forbidden in 0002_seed_family.sql 0006_system_admin.sql 0008_demo_recipes.sql 0013_seed_external_senders.sql 0092_allowance_clean_start_20261102.sql 0101_pilot_home_setting.sql; do
            if grep -q "/$forbidden" /tmp/portal-v1-migrations.txt; then
              echo "::error::Pilot family migration included: $forbidden"; exit 1
            fi
          done
          grep -q '/20261113_shared_adult_tasks.sql' /tmp/portal-v1-migrations.txt
          grep -q '/20261110_task_schedule_date_ranges.sql' /tmp/portal-v1-migrations.txt
          echo "Reviewed package contains generic code and sanitized migrations."

      - name: Check Ed25519 publisher trust root and sign the exact binary artifacts
        working-directory: frozen-source
        env:
          RELEASE_SIGNING_PRIVATE_KEY_PEM: ${{ secrets.RELEASE_SIGNING_PRIVATE_KEY_PEM }}
          EXPECTED_PUBLIC_KEY: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import {createPrivateKey,createPublicKey} from 'node:crypto';
          const privateKey=createPrivateKey(process.env.RELEASE_SIGNING_PRIVATE_KEY_PEM);
          if(privateKey.asymmetricKeyType!=='ed25519')throw Error('Only Ed25519 keys are allowed');
          const der=createPublicKey(privateKey).export({format:'der',type:'spki'});
          const prefix='302a300506032b6570032100';
          if(der.subarray(0,12).toString('hex')!==prefix)throw Error('Unexpected public key format');
          const hex=der.subarray(12).toString('hex');
          if(hex!==process.env.EXPECTED_PUBLIC_KEY)throw Error('Publisher public key does not match pinned trust root');
          console.log('Publisher trust root matches configured public key');
          NODE
          # Pin the resolved npm dependency graph inside the signed manifest.
          # It is supplementary provenance; the two compiled archive hashes
          # remain the installer's authoritative integrity checks.
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          const folder='.release-work/v1.0.0/';
          const lock=fs.readFileSync('package-lock.json');
          const digest=createHash('sha256').update(lock).digest('hex');
          const file=folder+'release-manifest.json';
          const manifest=JSON.parse(fs.readFileSync(file,'utf8'));
          if(manifest.sourceCommit!==process.env.FROZEN_SOURCE_SHA)throw Error('Unexpected source');
          manifest.notes.sv+=' Resolved npm lock SHA-256: '+digest+'.';
          fs.copyFileSync('package-lock.json',folder+'build-dependencies.lock.json');
          fs.writeFileSync(file,JSON.stringify(manifest),{flag:'w'});
          NODE
          node scripts/releases/build-release.mjs --sign "$RELEASE_TAG"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import {createHash} from 'node:crypto';
          import {verifySignedRelease,verifyReleaseArtifact} from './src/installer-release.js';
          const folder='.release-work/v1.0.0/';
          const raw=fs.readFileSync(folder+'release-manifest.json','utf8');
          const sig=fs.readFileSync(folder+'release-manifest.sig','utf8');
          const manifest=await verifySignedRelease(raw,sig,process.env.EXPECTED_PUBLIC_KEY);
          if(manifest.version!=='v1.0.0'||manifest.sourceCommit!==process.env.FROZEN_SOURCE_SHA||
             manifest.minFromVersion!==null)throw Error('Wrong release source or version');
          for(const artifact of manifest.artifacts){
            const bytes=new Uint8Array(fs.readFileSync(folder+artifact.name));
            await verifyReleaseArtifact(bytes,artifact);
          }
          const lock=fs.readFileSync(folder+'build-dependencies.lock.json');
          const lockDigest=createHash('sha256').update(lock).digest('hex');
          if(!manifest.notes.sv.includes('Resolved npm lock SHA-256: '+lockDigest+'.'))
            throw Error('Resolved dependencies not signed into manifest');
          console.log('Signature, source commit, dependency resolution and both release artifact digests verified');
          NODE

      - name: Create unpublished draft release and upload exactly the verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          folder="frozen-source/.release-work/$RELEASE_TAG"
          cat > /tmp/family-portal-v1-notes.md <<'NOTES'
          # Family Portal v1.0.0

          First family-neutral installer package from frozen private source commit
          `11df28d7906c5c4619076334a9e7e1789cf900e6`.

          Contains Worker code and mobile/wall assets plus reviewed, sanitized
          schema migrations. Includes shared adult tasks, dated schedules,
          seven-day swipe view, messaging, unsaved-draft protection, Safari kiosk
          photo upload and the isolated family-side issue reporter.

          **Installation is not enabled yet.** This release does not create a
          Worker, D1 database, R2 bucket or any family credentials. Family
          installations are performed only through the Wizard after the
          separate Cloudflare write-OAuth and provisioning implementation.

          Verify release-manifest.json against release-manifest.sig using the
          publisher public key pinned in your Installer; verify both archive
          SHA-256 digests in the signed manifest. The public key attached to a
          release is NOT a substitute for a locally pinned trust root.
          NOTES
          gh release create "$RELEASE_TAG" \
            "$folder/portal-worker-package.tar.gz" \
            "$folder/schema-migrations.tar.gz" \
            "$folder/release-manifest.json" \
            "$folder/release-manifest.sig" \
            "$folder/build-dependencies.lock.json" \
            --repo "$GH_REPO" --target main \
            --title "Family Portal $RELEASE_TAG" \
            --notes-file /tmp/family-portal-v1-notes.md --draft
          echo "Draft release created. The next step will publish only if all 5 assets are present."

      - name: Verify draft assets and publish once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          count=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '.assets | length')
          test "$count" -eq 5 || { echo "::error::Missing release files, draft retained"; exit 1; }
          names=$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq '[.assets[].name] | sort | join(",")')
          test "$names" = "build-dependencies.lock.json,portal-worker-package.tar.gz,release-manifest.json,release-manifest.sig,schema-migrations.tar.gz" || {
            echo "::error::Unexpected asset set, draft retained"; exit 1;
          }
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json url,isDraft,tagName
