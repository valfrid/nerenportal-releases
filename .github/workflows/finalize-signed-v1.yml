name: Finalize verified v1.0.0 release draft

# One-time recovery for GitHub draft/tag 404 after successful signature verification.
# Pins the previous successful build/sign/upload run and exact five asset IDs.
on:
  push:
    branches: [main]
    paths: ['.github/workflows/finalize-signed-v1.yml']
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Publish the already signed and verified v1.0.0 draft"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: first-signed-family-portal-v1
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.repository == 'valfrid/nerenportal-releases' && github.ref == 'refs/heads/main' && github.actor == 'valfrid' && ((github.event_name == 'push' && github.event.head_commit.message == 'Finalize previously signed v1.0.0 draft') || (github.event_name == 'workflow_dispatch' && inputs.confirmation == true)) }}
    environment: family-portal-release-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: valfrid/nerenportal-releases
      RELEASE_ID: "446372746"
      VERIFIED_RUN_ID: "43762662234"
      SOURCE_COMMIT: 11df28d7906c5c4619076334a9e7e1789cf900e6
      PUBLIC_KEY_FROZEN: 609cf86cd1d2cc20e333f49c420af4f9c4bbc1771edc50ed1f5fe17fe6a0249a
      PUBLIC_KEY_CONFIGURED: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check signed publisher trust root and the prior successful build/sign/upload steps
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLIC_KEY_CONFIGURED" = "$PUBLIC_KEY_FROZEN" || {
            echo "::error::Publisher trust root changed since the signed run"; exit 1;
          }
          steps=$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion == "success") | .name] | join("|")')
          for required in \
            'Verify publication prerequisites and prevent overwriting a release' \
            'Checkout exactly the reviewed PRIVATE source commit' \
            'Verify source identity' \
            'Build and test the generic release OFFLINE from Cloudflare' \
            'Inspect release package for private material and pilot seed data' \
            'Check Ed25519 publisher trust root and sign the exact binary artifacts' \
            'Create unpublished draft release and upload exactly the verified assets'
          do
            if [[ "$steps" != *"$required"* ]]; then
              echo "::error::A required verified source run step was not successful"; exit 1;
            fi
          done
          echo "Previous build, migration scan, Ed25519 verification and upload all passed."

      - name: Check immutable draft release ID and exact uploaded asset identities
        id: release
        shell: bash
        run: |
          set -euo pipefail
          draft=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.draft')
          tag=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.tag_name')
          body=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.body')
          test "$tag" = "v1.0.0" || { echo "::error::Wrong release tag"; exit 1; }
          [[ "$body" == *"$SOURCE_COMMIT"* ]] || {
            echo "::error::Release notes source commit mismatch"; exit 1;
          }
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" \
            --jq '[.assets[] | (.name + ":" + (.id|tostring) + ":" + (.size|tostring))] | sort | join(",")')
          expected='build-dependencies.lock.json:752378826:62839,portal-worker-package.tar.gz:752378833:802167,release-manifest.json:752378825:663,release-manifest.sig:752378828:86,schema-migrations.tar.gz:752378834:7777'
          test "$assets" = "$expected" || {
            echo "::error::Release assets have changed since signed upload"; exit 1;
          }
          if [ "$draft" = "false" ]; then
            echo "v1.0.0 already published with the same verified asset set."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [ "$draft" = "true" ]; then
            echo "Verified draft release and all five unchanged asset IDs."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown release status"; exit 1;
          fi

      - name: Publish the preverified existing draft by release ID (do not rebuild or re-sign)
        if: ${{ steps.release.outputs.already_published == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false --jq '{id,tag_name,draft,published_at,html_url}'
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.draft')" = false
          echo "Signed v1.0.0 is publicly published. No Cloudflare resources modified."
