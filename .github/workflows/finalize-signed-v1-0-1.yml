name: Finalize verified v1.0.1 signed release draft

# Recovery for GitHub's draft/tag 404 after the signed v1.0.1 build.
# Verify the exact previous signed build and original asset IDs before publishing.
# No rebuild/re-sign, no v1.0.0 changes, no Cloudflare operations.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Publish the already signed and verified v1.0.1 draft by release ID"
        type: boolean
        required: true
        default: false

permissions:
  contents: write
  actions: read

concurrency:
  group: signed-family-portal-v1-0-1
  cancel-in-progress: false

jobs:
  finalize:
    if: ${{ github.repository == 'valfrid/nerenportal-releases' && github.ref == 'refs/heads/main' && github.actor == 'valfrid' && github.event_name == 'workflow_dispatch' && inputs.confirmation == true }}
    environment: family-portal-release-publisher
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_REPO: valfrid/nerenportal-releases
      RELEASE_ID: "449879695"
      VERIFIED_RUN_ID: "44293523694"
      SOURCE_COMMIT: 802d9d98ce7d0633d92cf91ba6145f716b5bd224
      VERIFIED_PUBLISHER_SHA: ef4628704dcf699b62021b4d3460f48e3f249885
      PUBLIC_KEY_FROZEN: 609cf86cd1d2cc20e333f49c420af4f9c4bbc1771edc50ed1f5fe17fe6a0249a
      PUBLIC_KEY_CONFIGURED: ${{ vars.RELEASE_SIGNING_PUBLIC_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check signed publisher trust root and the prior successful build/sign/upload steps
        shell: bash
        run: |
          set -euo pipefail
          test "$PUBLIC_KEY_CONFIGURED" = "$PUBLIC_KEY_FROZEN" || {
            echo "::error::Publisher trust root changed since the signed run"; exit 1;
          }
          steps=$(gh api "repos/$GH_REPO/actions/runs/$VERIFIED_RUN_ID/jobs" \
            --jq '[.jobs[].steps[] | select(.conclusion == "success") | .name] | join("|")')
          test "$(gh api \"repos/$GH_REPO/actions/runs/$VERIFIED_RUN_ID\" --jq '.event')" = "workflow_dispatch"
          test "$(gh api \"repos/$GH_REPO/actions/runs/$VERIFIED_RUN_ID\" --jq '.actor.login')" = "valfrid"
          test "$(gh api \"repos/$GH_REPO/actions/runs/$VERIFIED_RUN_ID\" --jq '.head_sha')" = "$VERIFIED_PUBLISHER_SHA"
          for required in \
            'Verify release is new and publisher secrets are configured' \
            'Checkout exact tested private source commit' \
            'Verify frozen source identity and bootstrap fix' \
            'Run all source tests and produce offline signed-package candidates' \
            'Scan new package for secret files, family seeds and the compiled bootstrap fix' \
            'Sign immutable files with existing protected Ed25519 publisher identity'
          do
            if [[ "$steps" != *"$required"* ]]; then
              echo "::error::A required verified source run step was not successful"; exit 1;
            fi
          done
          echo "Previous build, migration scan, Ed25519 verification and upload all passed."

      - name: Check immutable draft release ID and exact uploaded asset identities
        id: release
        shell: bash
        run: |
          set -euo pipefail
          draft=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.draft')
          tag=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.tag_name')
          body=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.body')
          test "$tag" = "v1.0.1" || { echo "::error::Wrong release tag"; exit 1; }
          [[ "$body" == *"First-install fix for Cloudflare Workers bootstrap authentication."* ]] || {
            echo "::error::Unexpected release notes"; exit 1;
          }
          assets=$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" \
            --jq '[.assets[] | (.name + ":" + (.id|tostring) + ":" + (.size|tostring))] | sort | join(",")')
          expected='build-dependencies.lock.json:763102848:62839,portal-worker-package.tar.gz:763102849:803537,release-manifest.json:763102846:663,release-manifest.sig:763102845:86,schema-migrations.tar.gz:763102847:7777'
          test "$assets" = "$expected" || {
            echo "::error::Release assets have changed since signed upload"; exit 1;
          }
          if [ "$draft" = "false" ]; then
            echo "v1.0.1 already published with the same verified asset set."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          elif [ "$draft" = "true" ]; then
            echo "Verified draft release and all five unchanged asset IDs."
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Unknown release status"; exit 1;
          fi

      - name: Publish the preverified existing draft by release ID (do not rebuild or re-sign)
        if: ${{ steps.release.outputs.already_published == 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --method PATCH "repos/$GH_REPO/releases/$RELEASE_ID" \
            -F draft=false --jq '{id,tag_name,draft,published_at,html_url}'
          test "$(gh api "repos/$GH_REPO/releases/$RELEASE_ID" --jq '.draft')" = false
          echo "Signed v1.0.1 is publicly published. No Cloudflare resources modified."
